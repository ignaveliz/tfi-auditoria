<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260"><g transform="translate(10,12)">
  <defs>
    <linearGradient id="shieldcolor" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1B3A5C"/>
      <stop offset="1" stop-color="#122A44"/>
    </linearGradient>
    <linearGradient id="checkcolor" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C08A2E"/>
      <stop offset="1" stop-color="#E0B860"/>
    </linearGradient>
  </defs>

  <!-- escudo -->
  <path d="M110,14 L200,48 V126 C200,180 158,214 110,228 C62,214 20,180 20,126 V48 Z"
        fill="url(#shieldcolor)"/>

  <!-- filete interior -->
  <path d="M110,30 L186,58 V124 C186,170 150,199 110,211 C70,199 34,170 34,124 V58 Z"
        fill="none" stroke="#C08A2E" stroke-opacity="0.30" stroke-width="2.5"/>

  <!-- check / vector ascendente, segmentado -->
  <g fill="none" stroke="url(#checkcolor)" stroke-width="20"
     stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M60,124 L98,162 L130.5,134.6"/>
    <path d="M138.6,127.7 L171.1,100.3"/>
    <path d="M179.2,93.4 L214,64"/>
  </g>
</g></svg>